[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qualitylens"
version = "0.1.0"
description = "AI-assisted test generation and explainable change-risk scoring for Python code changes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rushikesh Sanjay Patil" }]
dependencies = ["pytest>=8", "networkx>=3"]

[project.optional-dependencies]
benchmark = ["matplotlib>=3.8", "scikit-learn>=1.3"]

[project.scripts]
qualitylens = "qualitylens.cli:main"

[tool.setuptools]
packages = ["qualitylens"]

[tool.setuptools.package-data]
qualitylens = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
